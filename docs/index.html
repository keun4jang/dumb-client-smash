<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거래처 개소리 줘패기</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      color: white;
      font-family: -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    h1 { font-size: 26px; color: #ffe033; margin-bottom: 10px; line-height: 1.3; }
    .sub { font-size: 15px; color: #888; margin-bottom: 36px; line-height: 1.6; }
    .btn {
      display: block;
      width: 100%;
      max-width: 300px;
      padding: 18px 24px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      border: none;
      margin-bottom: 14px;
    }
    .btn-yellow { background: #ffe033; color: #0d0d1a; }
    .btn-dark { background: #1e1e2e; color: white; border: 1px solid #333; font-size: 15px; }

    /* iOS 안내 박스 */
    #iosGuide {
      display: none;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
      max-width: 300px;
      margin-bottom: 20px;
    }
    #iosGuide p { font-size: 15px; color: #ccc; margin-bottom: 16px; line-height: 1.6; }
    .url-box {
      background: #0d0d1a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #ffe033;
      word-break: break-all;
      margin-bottom: 14px;
    }
    .copy-btn {
      background: #ffe033;
      color: #0d0d1a;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .copied { background: #4caf50 !important; color: white !important; }
    .step {
      display: flex;
      align-items: flex-start;
      text-align: left;
      margin-bottom: 10px;
      font-size: 14px;
      color: #aaa;
      line-height: 1.5;
    }
    .step-num {
      background: #ffe033;
      color: #0d0d1a;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      min-width: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      margin-right: 10px;
      margin-top: 1px;
    }
  </style>
</head>
<body>
  <h1>거래처 개소리<br>줘패기</h1>
  <p class="sub">쏟아지는 거래처 개소리를<br>탭해서 줘패세요!</p>

  <!-- iOS 카카오톡 안내 -->
  <div id="iosGuide">
    <p>iPhone 카카오톡에서는<br>Safari로 열어야 게임이 됩니다</p>
    <div class="step"><span class="step-num">1</span> 아래 주소 복사</div>
    <div class="url-box">loquacious-mermaid-8cf3a8.netlify.app</div>
    <button class="copy-btn" onclick="copyUrl()">주소 복사하기</button>
    <br><br>
    <div class="step"><span class="step-num">2</span> Safari 앱 열고 주소창에 붙여넣기</div>
    <div class="step"><span class="step-num">3</span> 접속하면 게임 시작!</div>
  </div>

  <a class="btn btn-yellow" id="playBtn" href="https://loquacious-mermaid-8cf3a8.netlify.app">게임 시작 ▶</a>
  <a class="btn btn-dark" href="https://loquacious-mermaid-8cf3a8.netlify.app">itch.io에서 열기</a>

  <script>
    const GAME_URL = "https://loquacious-mermaid-8cf3a8.netlify.app";
    const ua = navigator.userAgent.toLowerCase();
    const isKakao = ua.includes("kakao");
    const isIOS = /iphone|ipad|ipod/.test(ua);
    const isAndroid = ua.includes("android");
    const btn = document.getElementById("playBtn");

    if (isKakao && isIOS) {
      // iOS 카카오톡: 안내 박스 보여주기 + 스킴 시도
      document.getElementById("iosGuide").style.display = "block";
      btn.textContent = "Safari 스킴으로 열기 시도";
      btn.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(GAME_URL);
      // 스킴 자동 시도
      setTimeout(function() {
        window.location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(GAME_URL);
      }, 500);
    } else if (isKakao && isAndroid) {
      // Android 카카오톡: 크롬으로 열기
      btn.textContent = "크롬으로 열고 게임 시작 ▶";
      btn.addEventListener("click", function(e) {
        e.preventDefault();
        window.open(GAME_URL, "_blank");
      });
    } else {
      // 외부 브라우저면 바로 이동
      window.location.replace(GAME_URL);
    }

    function copyUrl() {
      navigator.clipboard.writeText(GAME_URL).then(function() {
        var b = document.querySelector(".copy-btn");
        b.textContent = "복사됐어요!";
        b.classList.add("copied");
        setTimeout(function() {
          b.textContent = "주소 복사하기";
          b.classList.remove("copied");
        }, 2000);
      }).catch(function() {
        // clipboard API 실패시 선택 방식
        var el = document.createElement("textarea");
        el.value = GAME_URL;
        document.body.appendChild(el);
        el.select();
        document.execCommand("copy");
        document.body.removeChild(el);
        var b = document.querySelector(".copy-btn");
        b.textContent = "복사됐어요!";
        b.classList.add("copied");
      });
    }
  </script>
</body>
</html>
