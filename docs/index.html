<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거래처 개소리 줘패기</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      color: white;
      font-family: -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      color: #ffe033;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 40px;
      line-height: 1.6;
    }
    .btn {
      display: block;
      width: 100%;
      max-width: 300px;
      padding: 18px 24px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      border: none;
      margin-bottom: 16px;
    }
    .btn-primary {
      background: #ffe033;
      color: #0d0d1a;
    }
    .btn-secondary {
      background: #222;
      color: white;
      font-size: 15px;
      padding: 14px 24px;
    }
    .notice {
      margin-top: 32px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>거래처 개소리<br>줘패기</h1>
  <p>쏟아지는 거래처 개소리를<br>탭해서 줘패세요!</p>

  <a class="btn btn-primary" id="playBtn" href="#">Safari로 열고 게임 시작</a>
  <a class="btn btn-secondary" href="https://keun4jang.itch.io/gaesori-game">그냥 여기서 열기</a>

  <p class="notice">카카오톡에서는 Safari로 열어야<br>게임이 정상 실행됩니다</p>

  <script>
    const GAME_URL = "https://keun4jang.itch.io/gaesori-game";
    const ua = navigator.userAgent.toLowerCase();
    const isKakao = ua.includes("kakao");
    const isIOS = /iphone|ipad|ipod/.test(ua);
    const isAndroid = ua.includes("android");

    const btn = document.getElementById("playBtn");

    if (isKakao && isIOS) {
      // iOS 카카오톡: openExternal 스킴으로 Safari 강제 오픈
      btn.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(GAME_URL);
      btn.textContent = "Safari로 열고 게임 시작 ▶";
    } else if (isKakao && isAndroid) {
      // Android 카카오톡: intent 스킴으로 크롬 오픈
      btn.href = "intent://" + GAME_URL.replace("https://", "") +
        "#Intent;scheme=https;package=com.android.chrome;end";
      btn.textContent = "크롬으로 열고 게임 시작 ▶";
    } else {
      // 이미 외부 브라우저면 바로 이동
      window.location.replace(GAME_URL);
    }
  </script>
</body>
</html>
